[package]
name = "celebracion"
version = "0.9.7"
description = "Gestión de comida de celebración y regalo"
authors = ["Mariano Ortuño"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "celebracion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
